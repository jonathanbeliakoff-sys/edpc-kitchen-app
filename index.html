<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#071C22">
  <meta name="background-color" content="#FFF8EF">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta name="apple-mobile-web-app-title" content="EDPC Kitchen">

  <title>EDPC Kitchen</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icon-512.png">

  <style>
    :root {
      --orange: #FE7F41;
      --aqua: #B1E4E3;
      --navy: #071C22;
      --cream: #FFF8EF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
    }

    #appFrame {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: var(--cream);
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: var(--cream);
      color: var(--navy);
      transition: opacity 0.25s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      width: 74px;
      height: 74px;
      border-radius: 18px;
      background: var(--orange);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy);
      font-weight: 900;
      font-size: 22px;
      letter-spacing: -1px;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
    }

    .sub {
      font-size: 13px;
      opacity: 0.65;
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin-top: 6px;
      border: 4px solid var(--aqua);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="logo">EDPC</div>
    <div class="title">Kitchen</div>
    <div class="sub">Loading Kitchen Board…</div>
    <div class="spinner"></div>
  </div>

  <iframe
    id="appFrame"
    title="EDPC Kitchen"
    allow="fullscreen"
    src="https://script.google.com/a/macros/culivino.com/s/AKfycbye6ib3ZV4Zw4_ULyNznvv5fwAd_WczD4wffDHmz_9d8vHP4uCsA0z1GyEKoIFyNQI/exec?app=kitchen"
  ></iframe>

  <script>
    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");

    frame.addEventListener("load", () => {
      setTimeout(() => {
        loading.classList.add("hidden");
      }, 250);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js")
          .catch((error) => {
            console.error("Service worker registration failed:", error);
          });
      });
    }
  </script>

</body>
</html>
